version: 2
updates:
  - package-ecosystem: npm
    directory: '/'
    schedule:
      interval: weekly
      day: monday
      time: '06:00'
      timezone: Etc/UTC
    open-pull-requests-limit: 5
    commit-message:
      prefix: chore
      include: scope
    labels:
      - dependencies
    # These three majors are coupled by peer ranges, so Dependabot cannot bump them
    # one at a time: `npm ci` fails with ERESOLVE before any check runs.
    #   vite 8                        <-> @sveltejs/vite-plugin-svelte 7 (each peers the other)
    #   typescript 7                  -> outside the peer range of svelte-check 4.7.6
    # Remove an entry when the pair is migrated in one deliberate pull request.
    ignore:
      - dependency-name: vite
        update-types: ['version-update:semver-major']
      - dependency-name: '@sveltejs/vite-plugin-svelte'
        update-types: ['version-update:semver-major']
      - dependency-name: typescript
        update-types: ['version-update:semver-major']
    groups:
      dev-dependencies:
        dependency-type: development
        update-types:
          - minor
          - patch
      production-dependencies:
        dependency-type: production
        update-types:
          - minor
          - patch

  - package-ecosystem: github-actions
    directory: '/'
    schedule:
      interval: weekly
      day: monday
      time: '06:00'
      timezone: Etc/UTC
    open-pull-requests-limit: 5
    commit-message:
      prefix: ci
      include: scope
    labels:
      - dependencies
      - github-actions
    # The CodeQL steps share one runtime version: `init` writes a configuration
    # file that `analyze` validates, and the action rejects a version mismatch
    # before query analysis. Separate PRs (#17, #18) each left one step behind
    # and both failed CodeQL. Group them so one PR moves both.
    groups:
      codeql-action:
        patterns:
          # SHA-pinned sub-actions are named owner/repo/path; a tag-pinned one is
          # named owner/repo only, so cover both shapes.
          - 'github/codeql-action'
          - 'github/codeql-action/*'
